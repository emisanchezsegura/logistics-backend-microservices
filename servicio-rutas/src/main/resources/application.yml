spring:
  application:
    name: servicio-rutas

  datasource:
    url: jdbc:postgresql://postgres_logistica:5432/logistica_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.default_schema: public
      hibernate.format_sql: true

server:
  port: 8084

google:
  api:
    base-url: https://maps.googleapis.com/maps/api/distancematrix/json
    key: ${GOOGLE_API_KEY}

app:
  transporte:
    url: http://servicio-transporte:8082/api
  
servicios:
  atencion:
    url: http://servicio-atencion:8081/api

logging:
  file:
    name: myApp.log
  logback:
    rollingpolicy:
      max-file-size: 1MB
      max-history: 10