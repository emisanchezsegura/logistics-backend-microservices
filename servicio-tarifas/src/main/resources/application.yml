spring:
  application:
    name: servicio-tarifas

  datasource:
    url: jdbc:postgresql://postgres:5432/logistica_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.default_schema: public
      hibernate.format_sql: true

servicios:
  depositos:
    url: http://servicio-depositos:8085/api

server:
  port: 8086

logging:
  file:
    name: myApp.log
  logback:
    rollingpolicy:
      max-file-size: 1MB
      max-history: 10
