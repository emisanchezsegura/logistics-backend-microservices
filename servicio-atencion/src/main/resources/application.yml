server:
  port: 8081

spring:
  application:
    name: servicio-atencion

  datasource:
    url: jdbc:postgresql://postgres:5432/logistica_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: public
        format_sql: true

logging:
  file:
    name: myApp.log
  logback:
    rollingpolicy:
      max-file-size: 1MB
      max-history: 10

# ✅ Sección de URLs de otros microservicios
servicios:
  transporte:
    url: http://servicio-transporte:8082
  rutas:
    url: http://servicio-rutas:8084
  tarifas:
    url: http://servicio-tarifas:8086
  depositos:
    url: http://servicio-depositos:8085/api/depositos
  estadias:
    url: http://servicio-depositos:8085/api/estadias
    
